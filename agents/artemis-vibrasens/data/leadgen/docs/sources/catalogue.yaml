- nom: API Recherche d'entreprises (DINUM, moteur de l'Annuaire des entreprises)
  url: https://recherche-entreprises.api.gouv.fr
  etape:
  - collecte
  - firmographie
  - verification
  apporte: SIREN/SIRET, dénomination, siège et établissements (adresse), NAF, tranche d'effectif, catégorie d'entreprise,
    date de création, état administratif, dirigeants (y compris commissaires aux comptes), finances par exercice
    (CA, résultat net), compléments (convention collective, ESS, RGE, bio, Egapro, organisme de formation…). Filtres
    NAF, section NAF, code postal, commune, département, région, tranche d'effectif, nature juridique. Ni site web,
    ni email, ni téléphone.
  couverture: France
  acces: aucun
  gratuit: sans clé, 7 appels/s par IP (limite que l'administration peut abaisser en cas de surcharge)
  cout: gratuit
  licence_cgu: Licence Ouverte 2.0 — usage commercial, stockage et redistribution autorisés avec mention de la source
  statut_2026: actif
  priorite: A
  notes: Testé le 01/10/2026 (NAF 62.01Z + département 35 + tranche 12 → 33 résultats, avec dirigeants et CA). Piège
    constaté — le filtre géographique porte sur n'importe quel établissement, si bien que le siège renvoyé peut
    être hors zone. Exclut les unités non diffusibles et les entités refusées au RCS. Index mis à jour chaque jour
    (Sirene, RNE, ratios financiers, etc.). Plafond de pagination à vérifier ; pour un ciblage exhaustif, passer
    par le stock Sirene. L'API Entreprise (entreprise.api.gouv.fr) est réservée aux administrations et donc inutilisable
    ici.
