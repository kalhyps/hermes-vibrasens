- nom: Cadre de collecte (robots.txt, user-agent, rythme)
  url: https://www.rfc-editor.org/rfc/rfc9309.html
  etape:
  - lecture
  apporte: 'RFC 9309 : la règle la plus spécifique l''emporte et Allow gagne en cas d''égalité ; cache de 24 h maximum
    ; robots.txt en erreur 4xx = accès libre, en 5xx = tout interdit ; Crawl-delay ne fait pas partie du standard'
  couverture: Mondial ; règles UE et France
  acces: aucun
  gratuit: —
  cout: —
  licence_cgu: 'CNIL (fiche moissonnage) : respecter robots.txt et CAPTCHA, minimiser, tenir la liste des sources.
    Directive 2019/790, considérant 18 : opposition à la fouille de textes et de données (TDM) par procédé lisible
    par machine. CGU Google : interdit de passer outre le robots.txt'
  statut_2026: actif
  priorite: A
  notes: 'Réglages à appliquer : UA identifiable avec contact ; 1 requête simultanée et au moins 1 s d''intervalle
    par domaine ; respect de Retry-After ; préférer l''API officielle au scraping.'
  sources:
  - https://www.rfc-editor.org/rfc/rfc9309.html
  - https://www.cnil.fr/fr/focus-interet-legitime-collecte-par-moissonnage
  - https://policies.google.com/terms?hl=en
  rapport: lecture et signaux
